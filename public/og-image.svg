<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#060610"/>
  
  <!-- Grid pattern -->
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
    <radialGradient id="pinkOrb" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#ff1a7c" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ff1a7c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanOrb" cx="85%" cy="80%" r="45%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff1a7c"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#pinkOrb)"/>
  <rect width="1200" height="630" fill="url(#cyanOrb)"/>

  <!-- NR badge -->
  <rect x="80" y="80" width="72" height="72" rx="16" fill="#ff1a7c"/>
  <text x="116" y="131" font-family="system-ui, sans-serif" font-size="28" font-weight="900" fill="white" text-anchor="middle">NR</text>

  <!-- Name -->
  <text x="80" y="300" font-family="system-ui, sans-serif" font-size="72" font-weight="900" fill="url(#nameGrad)">Nafisur Rahman</text>

  <!-- Role -->
  <text x="80" y="370" font-family="system-ui, sans-serif" font-size="32" font-weight="600" fill="#a0a0c0">Senior Software Engineer · WellDev</text>

  <!-- Tech tags -->
  <rect x="80" y="420" width="160" height="40" rx="8" fill="#ff1a7c18" stroke="#ff1a7c44" stroke-width="1"/>
  <text x="160" y="446" font-family="system-ui, sans-serif" font-size="18" fill="#ff80b8" text-anchor="middle">.NET Core</text>
  
  <rect x="256" y="420" width="120" height="40" rx="8" fill="#0ea5e918" stroke="#0ea5e944" stroke-width="1"/>
  <text x="316" y="446" font-family="system-ui, sans-serif" font-size="18" fill="#7dd3fc" text-anchor="middle">Azure</text>
  
  <rect x="392" y="420" width="120" height="40" rx="8" fill="#22d3ee18" stroke="#22d3ee44" stroke-width="1"/>
  <text x="452" y="446" font-family="system-ui, sans-serif" font-size="18" fill="#67e8f9" text-anchor="middle">Next.js</text>

  <rect x="528" y="420" width="200" height="40" rx="8" fill="#a855f718" stroke="#a855f744" stroke-width="1"/>
  <text x="628" y="446" font-family="system-ui, sans-serif" font-size="18" fill="#d8b4fe" text-anchor="middle">Power Automate</text>

  <!-- Domain hint -->
  <text x="80" y="560" font-family="system-ui, monospace" font-size="22" fill="#60607a">nafisurrahman.dev</text>
</svg>
